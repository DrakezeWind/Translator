# App name must be globally unique on Fly — change this if it's taken.
app = "translator-lingo"
primary_region = "iad"

[build]

[env]
  ENV = "production"
  HISTORY_FILE_PATH = "/data/translator_history.json"

[[mounts]]
  source = "translator_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
